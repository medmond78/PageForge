# Technical Report Style Configuration
# Professional style for engineering/scientific documents

page:
  size: letter
  orientation: portrait
  margins:
    top: 1.0
    bottom: 1.0
    left: 1.0
    right: 1.0

fonts:
  body: Times-Roman      # Traditional serif for body
  heading: Helvetica-Bold  # Sans-serif for headings (contrast)
  code: Courier
  sizes:
    body: 10
    heading1: 16
    heading2: 14
    heading3: 12
    heading4: 11
    heading5: 10
    heading6: 10
    code: 8.5

colors:
  text: "#000000"
  headings: "#003366"    # Navy blue for headings
  code_bg: "#f0f0f0"
  code_text: "#000000"

spacing:
  line_spacing: 1.15     # Tight spacing to fit more content
  paragraph_spacing: 6
  heading_spacing: 10
  list_indent: 20

images:
  max_width: 6.5
  max_height: 8.5
  dpi: 150
  fallback_dir: ./images

code:
  wrap: true
  font_size: 8.5
  line_spacing: 1.1
  background_color: "#f0f0f0"
